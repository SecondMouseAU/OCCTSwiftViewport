name: OCCTSwiftViewport
options:
  bundleIdPrefix: com.occtswift
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "1.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  OCCTSwiftViewport:
    path: .
  OCCTSwift:
    path: ../OCCTSwift
  OCCTSwiftTools:
    url: https://github.com/gsdali/OCCTSwiftTools.git
    from: 1.0.0

targets:
  OCCTSwiftMetalDemo:
    type: application
    platform: [macOS, iOS, visionOS]
    sources:
      - path: Examples/MetalDemo/Sources/OCCTSwiftMetalDemo
    dependencies:
      - package: OCCTSwiftViewport
      - package: OCCTSwiftTools
        product: OCCTSwiftTools
      - package: OCCTSwift
        product: OCCTSwift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.metal-demo
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS: ["-weak_framework", "AVKit"]
        DEVELOPMENT_TEAM: 6D6BN844NR
        # iOS Info.plist keys — ignored on macOS. Support all orientations
        # (CAD viewport is useful in any), and auto-generate a launch screen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Dedicated, dependency-light on-device verification app for the direct-mesh
  # spike (Phase 4). Depends ONLY on OCCTSwiftViewport (no OCCT.xcframework), so it
  # builds fast and has no crashing sidebar surface. Not part of the shipping demo.
  DirectMeshVerify:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Examples/DirectMeshVerify
    dependencies:
      - package: OCCTSwiftViewport
    prebuildScripts:
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        script: |
          GIT_SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "no-git")
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then
            GIT_SHA="${GIT_SHA}+dirty"
          fi
          BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")
          STAMP_FILE="$SRCROOT/Examples/DirectMeshVerify/BuildStamp.swift"
          cat > "$STAMP_FILE" <<EOF
          // Auto-generated by the "Stamp build info" script phase — do not edit by hand. Tracked
          // in git with a placeholder value (see the comment in BuildStamp.swift); this rewrite
          // is expected to show up as a local modification after every on-device build.
          enum BuildStamp {
              static let value = "${GIT_SHA} · ${BUILD_TIME}"
          }
          EOF
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.directmesh-verify
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6D6BN844NR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  OCCTSwiftMetalDemoUITests_macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/OCCTSwiftMetalDemoUITests
    dependencies:
      - target: OCCTSwiftMetalDemo_macOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.metal-demo.uitests
        GENERATE_INFOPLIST_FILE: YES

  OCCTSwiftMetalDemoUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/OCCTSwiftMetalDemoUITests
    dependencies:
      - target: OCCTSwiftMetalDemo_iOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.metal-demo.uitests
        GENERATE_INFOPLIST_FILE: YES
