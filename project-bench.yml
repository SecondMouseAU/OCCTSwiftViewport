# SpikeBench on its own: `xcodegen --spec project-bench.yml`, which writes SpikeBench.xcodeproj
# (schemes SpikeBench_iOS / SpikeBench_macOS).
#
# Like project-verify.yml this needs nothing outside this repo: the target depends only on
# OCCTSwiftViewport, so there is no ../OCCTSwift sibling to validate and no OCCT binary to fetch.
# Works from worktrees and fresh clones. The target itself is defined once, in
# Examples/SpikeBench/target.yml, and project.yml includes the same file.
name: SpikeBench
include:
  - path: Examples/SpikeBench/target.yml
    relativePaths: false
options:
  bundleIdPrefix: com.occtswift
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  OCCTSwiftViewport:
    path: .
