# DirectMeshVerify target, shared by two XcodeGen specs:
#   - project.yml          full demo project (needs ../OCCTSwift checked out next to this repo)
#   - project-verify.yml   this target alone; needs only this repo
# Both include this file with `relativePaths: false`, so paths here are repo-root relative.
targets:
  # Dedicated, dependency-light on-device verification app for the direct-mesh
  # spike (Phase 4). Depends ONLY on OCCTSwiftViewport (no OCCT.xcframework), so it
  # builds fast and has no crashing sidebar surface. Not part of the shipping demo.
  DirectMeshVerify:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Examples/DirectMeshVerify
        excludes:
          - target.yml
    dependencies:
      - package: OCCTSwiftViewport
    prebuildScripts:
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        script: |
          GIT_SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "no-git")
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then
            GIT_SHA="${GIT_SHA}+dirty"
          fi
          BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")
          STAMP_FILE="$SRCROOT/Examples/DirectMeshVerify/BuildStamp.swift"
          cat > "$STAMP_FILE" <<EOF
          // Auto-generated by the "Stamp build info" script phase — do not edit by hand. Tracked
          // in git with a placeholder value (see the comment in BuildStamp.swift); this rewrite
          // is expected to show up as a local modification after every on-device build.
          enum BuildStamp {
              static let value = "${GIT_SHA} · ${BUILD_TIME}"
          }
          EOF
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.directmesh-verify
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6D6BN844NR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
