# SpikeBench target, shared by two XcodeGen specs:
#   - project.yml        full demo project (needs ../OCCTSwift checked out next to this repo)
#   - project-bench.yml  this target alone; needs only this repo
# Both include this file with `relativePaths: false`, so paths here are repo-root relative.
targets:
  # Benchmark and test app for the #141 transform-update measurements and the #139 heightfield
  # spike. Depends ONLY on OCCTSwiftViewport (no OCCT.xcframework), so it builds in seconds.
  # Build the Release configuration for any number you intend to quote.
  SpikeBench:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Examples/SpikeBench
        excludes:
          - target.yml
    dependencies:
      - package: OCCTSwiftViewport
    prebuildScripts:
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        script: |
          GIT_SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "no-git")
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then
            GIT_SHA="${GIT_SHA}+dirty"
          fi
          BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")
          STAMP_FILE="$SRCROOT/Examples/SpikeBench/BuildStamp.swift"
          cat > "$STAMP_FILE" <<EOF
          // Auto-generated by the "Stamp build info" script phase — do not edit by hand. Tracked
          // in git with a placeholder value (see the comment in BuildStamp.swift); this rewrite
          // is expected to show up as a local modification after every build.
          enum BuildStamp {
              static let value = "${GIT_SHA} · ${BUILD_TIME}"
          }
          EOF
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.occtswift.spike-bench
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6D6BN844NR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
